version: '3.8'

services:
  mysql-uat:
    image: mysql:8.0
    container_name: jyotish-mysql-uat
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_uat_password
      MYSQL_DATABASE: jyotish_uat_db
      MYSQL_USER: jyotish_uat_user
      MYSQL_PASSWORD: jyotish_uat_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_uat_data:/var/lib/mysql

  backend-uat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jyotish-backend-uat
    restart: always
    environment:
      NODE_ENV: uat
      PORT: 5000
      DB_HOST: mysql-uat
      DB_PORT: 3306
      DB_USER: jyotish_uat_user
      DB_PASSWORD: jyotish_uat_password
      DB_NAME: jyotish_uat_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "5002:5000"
    depends_on:
      - mysql-uat

  frontend-uat:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jyotish-frontend-uat
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - backend-uat

volumes:
  mysql_uat_data:
