apiVersion: apps/v1
kind: Deployment
metadata:
  name: jyotish-frontend
  namespace: jyotish
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jyotish-frontend
  template:
    metadata:
      labels:
        app: jyotish-frontend
    spec:
      containers:
        - name: frontend
          image: siddharthzend/jyotish-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: jyotish-frontend
  namespace: jyotish
spec:
  selector:
    app: jyotish-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
