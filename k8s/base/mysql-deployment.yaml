apiVersion: apps/v1
kind: Deployment
metadata:
  name: jyotish-mysql
  namespace: jyotish
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jyotish-mysql
  template:
    metadata:
      labels:
        app: jyotish-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jyotish-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: jyotish-secrets
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: jyotish-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jyotish-secrets
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: jyotish-mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jyotish-mysql
  namespace: jyotish
spec:
  selector:
    app: jyotish-mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
