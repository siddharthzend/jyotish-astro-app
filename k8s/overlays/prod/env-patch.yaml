apiVersion: v1
kind: ConfigMap
metadata:
  name: jyotish-config
  namespace: jyotish
data:
  NODE_ENV: "prod"
  PORT: "5000"
  DB_NAME: "jyotish_prod_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jyotish-backend
  namespace: jyotish
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: DB_NAME
              value: jyotish_prod_db
            - name: DB_USER
              value: root
