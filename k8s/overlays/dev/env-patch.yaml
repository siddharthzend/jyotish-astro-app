apiVersion: v1
kind: ConfigMap
metadata:
  name: jyotish-config
  namespace: jyotish
data:
  NODE_ENV: "dev"
  PORT: "5000"
  DB_NAME: "jyotish_dev_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jyotish-backend
  namespace: jyotish
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: DB_NAME
              value: jyotish_dev_db
            - name: DB_USER
              value: root
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jyotish-frontend
  namespace: jyotish
spec:
  template:
    spec:
      containers:
        - name: frontend
          ports:
            - containerPort: 80
