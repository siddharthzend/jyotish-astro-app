version: '3.8'

services:
  mysql-dev:
    image: mysql:8.0
    container_name: jyotish-mysql-dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: jyotish_dev_db
      MYSQL_USER: jyotish_dev_user
      MYSQL_PASSWORD: jyotish_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jyotish-backend-dev
    restart: always
    environment:
      NODE_ENV: dev
      PORT: 5000
      DB_HOST: mysql-dev
      DB_PORT: 3306
      DB_USER: jyotish_dev_user
      DB_PASSWORD: jyotish_dev_password
      DB_NAME: jyotish_dev_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "5001:5000"
    depends_on:
      - mysql-dev

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jyotish-frontend-dev
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend-dev

volumes:
  mysql_dev_data:
