version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jyotish-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: jyotish_db
      MYSQL_USER: jyotish_user
      MYSQL_PASSWORD: jyotish_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jyotish-backend
    restart: always
    environment:
      NODE_ENV: dev
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: jyotish_user
      DB_PASSWORD: jyotish_password
      DB_NAME: jyotish_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jyotish-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
