version: '3.8'

services:
  mysql-prod:
    image: mysql:8.0
    container_name: jyotish-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_prod_password
      MYSQL_DATABASE: jyotish_prod_db
      MYSQL_USER: jyotish_prod_user
      MYSQL_PASSWORD: jyotish_prod_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql

  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jyotish-backend-prod
    restart: always
    environment:
      NODE_ENV: prod
      PORT: 5000
      DB_HOST: mysql-prod
      DB_PORT: 3306
      DB_USER: jyotish_prod_user
      DB_PASSWORD: jyotish_prod_password
      DB_NAME: jyotish_prod_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      - mysql-prod

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jyotish-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-prod

volumes:
  mysql_prod_data:
